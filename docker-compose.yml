# =============================================================================
# AI 高中学习教练 — 可选 Docker 编排
#
# ⚠️ 状态：**未在真实 Docker 环境中执行验证过**（开发机未安装 Docker）。
#    请先阅读 docs/DEPLOY.md 顶部的验证状态说明与核对清单。
#
# 使用方式：
#   1. cp .env.example .env 并至少设置 SESSION_SECRET
#   2. docker compose up -d --build
#   3. 打开 http://localhost:3000
#
# 注意：本地开发**不需要**这个文件。第一版用 `npm run dev` 即可，
#      SQLite 会自动创建，无需任何数据库服务。
# =============================================================================

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ai-study-coach:local
    container_name: ai-study-coach
    restart: unless-stopped

    ports:
      - '3000:3000'

    env_file:
      # 密钥与服务配置都从 .env 读取，**不写进 compose 文件**
      - .env

    environment:
      NODE_ENV: production
      # 容器内的数据库路径（相对于 prisma/ 目录解析）
      DATABASE_URL: file:../.data/dev.db
      # 上传文件同样落在数据卷里
      UPLOAD_DIR: /app/.data/uploads
      # 应用对外地址（用于日志与链接生成）
      APP_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: '1'

    volumes:
      # 唯一需要持久化的目录：SQLite 数据库 + 上传的题目图片
      # 命名卷（而不是绑定挂载）可以避免 Windows/macOS 上的权限与性能问题
      - study-coach-data:/app/.data

    healthcheck:
      # 与 Dockerfile 里的 HEALTHCHECK 一致；这里显式声明便于查看状态
      test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1:3000/api/health']
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3

    # 单副本：SQLite 是单写者模型，多副本共享同一个文件会出问题。
    # 需要横向扩展时请先迁移到 PostgreSQL（见 docs/DATABASE.md 第 6 节）。
    deploy:
      replicas: 1

volumes:
  study-coach-data:
    driver: local
